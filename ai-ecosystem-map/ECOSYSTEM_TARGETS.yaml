        peer_bar: "In-house KG construction + graph-aware retrieval."
        not_peer_evidence: ["import graphrag"]
      unstructured:
        label: "Unstructured"
        capability_definition: >
          Document ETL for LLMs: parsing PDF/HTML/Office into clean,
