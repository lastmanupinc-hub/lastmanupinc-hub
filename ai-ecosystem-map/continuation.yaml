###############################################################################
# continuation.yaml — live state ledger for the AI Ecosystem Capability Map
# Updated at the END of every session. automated_loop_state is the resume
# pointer every new session reads first (via begin.yaml).
###############################################################################
project_continuation:
  version: v1
  role: live_state_ledger_and_post_session_truth

  reference_policy:
    before_session_read: [begin.yaml, continuation.yaml, SCAN_TREE.yaml]
    after_session:
      - update_automated_loop_state   # set next_candidate_id before ending ANY session
      - append_change_log_entry
      - matrix_change_log_also_updated_if_rows_touched
    recursive_self_triggering_forbidden: true

  automated_loop_state:
    mode: continuous_candidate_completion
    policy_source: begin.yaml#autonomous_loop_bootstrap
    backlog_source: SCAN_TREE.yaml
    last_updated: "2026-08-16"
    last_completed_candidate_id: CAND-SCAN-03   # no-fate-payment-engine, paid-docs — MCP_MCP_SDK strengthened (3 independent implementations, 2 repos), SEC_NEMO_GUARDRAILS newly partial (AgentPolicy tool-use rails), LLM_ANTHROPIC_CLAUDE vendor_in_use recorded (TF certify-or-refuse engine runs on real Claude API — dependence, never credited). Overall floor 4.8%, 9/31 repos. Swept a recurring \.well-known YAML-escape bug and a duplicate-key bug in this file's own change_log.
    next_candidate_id: CAND-SCAN-04             # AXIS-ENGINE (+ AXIS-X-Y-Z via diff -rq mirror-verify), axis-seo — biggest batch (~91k files), grep-only depth per the huge-repo rule
    completed_candidate_ids: [CAND-SCAN-01, CAND-SCAN-02, CAND-SCAN-03]

  scan_phase:
    active: true
    started: "2026-08-16"
    artifact_url: "https://claude.ai/code/artifact/ee96e72a-d6b9-4f36-a974-04ce825b9986"
    artifact_rule: >
      After each session's re-render, republish derived/capability_map.html to
      this same URL (pass it as `url` to the Artifact tool) so the picture
      stays at one stable link.
    strategy_doc: SONNET5_ECOSYSTEM_SCAN_STRATEGY.md
    backlog_source: SCAN_TREE.yaml
    exit_criteria_source: SCAN_TREE.yaml#exit_criteria
    note: >
      Repo-major loop: 11 scan batches + 1 consolidation. Every session
      executes exactly one candidate, commits once per the ritual, and
      advances next_candidate_id before ending.

  # Newest-first. {date, session_id, summary, files_changed, commit}
  change_log:
    - date: "2026-08-16"
      session_id: "CAND-SCAN-03 (Sonnet 5, continued same conversation as Session 0/CAND-SCAN-02)"
      summary: >-
        Scanned no-fate-payment-engine (4997 files, AI-heaviest repo) and
        paid-docs (16 files, docs-only). MCP_MCP_SDK strengthened with a
        second independent hand-rolled MCP server (Go, dual HTTP+SSE
        transport, go-backend/internal/agent/mcp.go) plus a third MCP
        surface (paid-work-router-mcp TS package) — stays peer, now 3
        implementations across 2 repos. SEC_NEMO_GUARDRAILS newly graded
        partial: AgentPolicy is a tested, production-wired deny-by-default
        tool-use rail system gating every AI-agent MCP tool call
        (allow-list, spend caps, provider restrictions); missing_for_peer
        notes it covers tool-call authorization only, not topic/jailbreak/
        content-safety rails. LLM_ANTHROPIC_CLAUDE vendor_in_use recorded:
        the TF certify-or-refuse engine's deep-audit (Opus) and
        conversational (Sonnet) layers call the real Anthropic Messages
        API — genuine AI usage, but dependence, never credited toward the
        grade per doctrine (a stale "powered by OpenAI" docstring nearby
        was checked and found unbacked by code, so NOT recorded).
        TF certification/classification/scoring engines verified
        deterministic (threshold/lookup-based, not LLM-driven) — correctly
        left uncredited; radar_ml_pipeline.go verified real in-house ML but
        for fraud-risk not language, off-target; embed_handler.go confirmed
        a false positive (checkout-widget iframe, not text embeddings).
