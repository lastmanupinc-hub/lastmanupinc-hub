      files_changed: [AI_ECOSYSTEM_CAPABILITY_MATRIX.yaml, SCAN_TREE.yaml, continuation.yaml, derived/rollup.json, derived/capability_map.html, evidence/no-fate-payment-engine.scan.yaml, evidence/paid-docs.scan.yaml]
