        peer_bar: "In-house composition framework for LLM pipeline steps."
        not_peer_evidence: ["import langchain"]
      llamaindex:
        label: "LlamaIndex"
        capability_definition: >
          Data framework for LLMs: ingestion, indexing (vector/keyword/graph),
