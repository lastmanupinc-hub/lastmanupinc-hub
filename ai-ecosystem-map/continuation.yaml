###############################################################################
# continuation.yaml — live state ledger for the AI Ecosystem Capability Map
# Updated at the END of every session. automated_loop_state is the resume
# pointer every new session reads first (via begin.yaml).
###############################################################################
project_continuation:
  version: v1
  role: live_state_ledger_and_post_session_truth

  reference_policy:
    before_session_read: [begin.yaml, continuation.yaml, SCAN_TREE.yaml]
    after_session:
      - update_automated_loop_state   # set next_candidate_id before ending ANY session
      - append_change_log_entry
      - matrix_change_log_also_updated_if_rows_touched
    recursive_self_triggering_forbidden: true

  automated_loop_state:
    mode: continuous_candidate_completion
    policy_source: begin.yaml#autonomous_loop_bootstrap
    backlog_source: SCAN_TREE.yaml
    last_updated: "2026-08-16"
    last_completed_candidate_id: CAND-SCAN-06   # AXIS-odyssey ("Axis Toolbox" codebase-artifact generator, 3,429 files -- the source of the "Generated by Axis Skills" footer seen on many portfolio CLAUDE.md files): contributed a FOURTH independent MCP implementation (TypeScript), production-wired to a LIVE hosted endpoint (axis-api-6c7z.onrender.com/mcp) other repos reference as real -- MCP_MCP_SDK/MCP_MCP_REGISTRY stay peer, now backed by evidence across 3 repos + 3 languages. Verified its 144 "deterministic generators" make ZERO real LLM API calls anywhere (not RAG/LLM-credited), and its search tool is lexical not semantic (not RAG/Embedding-credited). AXIS-Gold (deterministic narrative-to-code truth-tracking framework) fully absent -- "narrative parsing" is plain regex, not NLP. assetforge (3D/image asset generation via Hugging Face Spaces) off-target for all 89 slots but yielded the first genuinely-live LLM_HUGGING_FACE vendor_in_use record (real HF Space consumption, correctly not credited as peer -- consuming a model hub isn't being one). Fixed a gov_lint.py G4 path-regex gap (didn't handle comma-separated line-ref citations like ":238,244-245"). Overall floor holds at 5.7%, repos scanned 15 -> 18.
    next_candidate_id: CAND-SCAN-07             # PMD-MASTER, AXIS-NRPG, axis-toolbox-examples
    completed_candidate_ids: [CAND-SCAN-01, CAND-SCAN-02, CAND-SCAN-03, CAND-SCAN-04, CAND-SCAN-05, CAND-SCAN-06]

  scan_phase:
    active: true
    started: "2026-08-16"
    artifact_url: "https://claude.ai/code/artifact/ee96e72a-d6b9-4f36-a974-04ce825b9986"
    artifact_rule: >
      After each session's re-render, republish derived/capability_map.html to
      this same URL (pass it as `url` to the Artifact tool) so the picture
      stays at one stable link.
    strategy_doc: SONNET5_ECOSYSTEM_SCAN_STRATEGY.md
    backlog_source: SCAN_TREE.yaml
    exit_criteria_source: SCAN_TREE.yaml#exit_criteria
    note: >
      Repo-major loop: 11 scan batches + 1 consolidation. Every session
      executes exactly one candidate, commits once per the ritual, and
      advances next_candidate_id before ending.

