not_credited_adjacent_findings: >
  AXR/axis-xr-phase16a/src/ml_models.rs ("F-119: ML model management") is a
  pure metadata/registry system (register_model, versioning, tags, status)
  with zero predict/infer/train methods -- no real ML inference, just
  bookkeeping for a game feature that references "ML models" conceptually.
  Not credited toward any slot. slate/axis_book_to_game.py and
  pipeline/axis_book_to_game.py (876 and 993 lines, DIFFERENT content despite
  the same name) are real multi-stage content pipelines (source_intake ->
  narrative_parse -> canon_compile -> adaptation_contract -> ...) but the
  stage logic sampled (_stable_int, _extract_pd_terms, _build_obstacles) is
  deterministic/procedural, not an autonomous planning/tool-calling agent --
  not credited toward AGE_LANGGRAPH or any AGT_* slot (that grade already
  rests on AXIS-Foundry's evidence from CAND-SCAN-02).
  model_router.py's PINNED_MODELS table references real vendor model families
  (anthropic/openai/xai) and judge_quorum.py's docstring says implementations
  "live in tools/ai/clients/<family>.py" -- but that directory DOES NOT EXIST
  on disk. This is unwired scaffolding: pinned model identifiers in a routing
  table with no live API client code. NOT recorded as vendor_in_use (that
  would overclaim a dependence that isn't actually live) -- noted here
  instead for honesty/audit-trail purposes. Revisit if a future scan finds
  tools/ai/clients/ has since been implemented.
