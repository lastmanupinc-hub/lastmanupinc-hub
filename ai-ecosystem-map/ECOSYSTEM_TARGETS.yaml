        peer_bar: "In-house multi-format document parser producing typed elements."
        not_peer_evidence: ["import unstructured"]
      embedchain:
        label: "EmbedChain"
        capability_definition: >
          Minimal add-data-then-ask RAG bots: one-call ingestion of sources
          into embeddings + retrieval-answering.
        peer_bar: "In-house minimal RAG-bot bootstrap path."
        not_peer_evidence: ["import embedchain"]

