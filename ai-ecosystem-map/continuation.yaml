###############################################################################
# continuation.yaml — live state ledger for the AI Ecosystem Capability Map
# Updated at the END of every session. automated_loop_state is the resume
# pointer every new session reads first (via begin.yaml).
###############################################################################
project_continuation:
  version: v1
  role: live_state_ledger_and_post_session_truth

  reference_policy:
    before_session_read: [begin.yaml, continuation.yaml, SCAN_TREE.yaml]
    after_session:
      - update_automated_loop_state   # set next_candidate_id before ending ANY session
      - append_change_log_entry
      - matrix_change_log_also_updated_if_rows_touched
    recursive_self_triggering_forbidden: true

  automated_loop_state:
    mode: continuous_candidate_completion
    policy_source: begin.yaml#autonomous_loop_bootstrap
    backlog_source: SCAN_TREE.yaml
    last_updated: "2026-08-16"
    last_completed_candidate_id: CAND-SCAN-04   # AXIS-ENGINE (91k files, grep-only depth) + AXIS-X-Y-Z (mirror-verified, not independently scanned) + axis-seo (full read, absent). OBS_PROMPTFOO newly bench: a real CI-gated LLM-judge harness (model_router.py declarative routing + judge_quorum.py cross-family quorum + fidelity_floor.py 8-oracle chokepoint, wired as numbered QGATE CI gates with self-tests). Verified NOT credited: ml_models.rs is a metadata-only registry (no inference), book-to-game pipeline stages are deterministic not agentic, and model_router's vendor model references are unwired scaffolding (referenced tools/ai/clients/ doesn't exist -- correctly NOT recorded as vendor_in_use). Overall floor 5.7%, 12/31 repos. ROOT-CAUSED a recurring escape-corruption bug: apply-script re.sub() calls that pass previously-read backslash-bearing text as a REPLACEMENT string get it silently re-interpreted (backreference syntax) and halved on every pass -- eliminated the landmine by rephrasing the one affected fragment without a literal backslash, and documented the gotcha + fix pattern in SONNET5_ECOSYSTEM_SCAN_STRATEGY.md for future sessions.
    next_candidate_id: CAND-SCAN-05             # AXIS-mars, pmd-customizer-build, profitforge
    completed_candidate_ids: [CAND-SCAN-01, CAND-SCAN-02, CAND-SCAN-03, CAND-SCAN-04]

  scan_phase:
    active: true
    started: "2026-08-16"
    artifact_url: "https://claude.ai/code/artifact/ee96e72a-d6b9-4f36-a974-04ce825b9986"
    artifact_rule: >
      After each session's re-render, republish derived/capability_map.html to
      this same URL (pass it as `url` to the Artifact tool) so the picture
      stays at one stable link.
    strategy_doc: SONNET5_ECOSYSTEM_SCAN_STRATEGY.md
    backlog_source: SCAN_TREE.yaml
    exit_criteria_source: SCAN_TREE.yaml#exit_criteria
    note: >
      Repo-major loop: 11 scan batches + 1 consolidation. Every session
      executes exactly one candidate, commits once per the ritual, and
      advances next_candidate_id before ending.

  # Newest-first. {date, session_id, summary, files_changed, commit}
  change_log:
    - date: "2026-08-16"
      session_id: "CAND-SCAN-04 (Sonnet 5, continued same conversation as Session 0/CAND-SCAN-02/03; approved via a plan-mode checkpoint mid-loop)"
      summary: >-
        Scanned AXIS-ENGINE (91,207 files, a real-time/XR rendering engine
        matching A-eye's IRIS/RETINA/PUPIL whitepaper) with grep-only depth
        per the huge-repo rule -- raw battery hit counts were in the
        thousands per category, confirmed dominated by graphics-engine
        vocabulary collisions (rendering pipeline, GPU memory/queue, ray
        trace) rather than AI-ecosystem capability. Found and verified one
        genuine AI subsystem: tools/ai/ + tools/oracles/, a CI-gated
        LLM-judge harness for a book-to-game content pipeline -- declarative
        model routing (model_router.py), cross-family 2-judge quorum voting
        with tiebreak/escalation (judge_quorum.py), and an 8-oracle
        fidelity-floor enforcement chokepoint (fidelity_floor.py), all wired
        as numbered CI gates (QGATE_3/6/7) with embedded self-tests run via
        run_all_gates.py. Graded OBS_PROMPTFOO bench. Verified and explicitly
        did NOT credit: ml_models.rs (metadata-only ML registry, zero
        predict/infer/train methods), axis_book_to_game.py's pipeline stages
        (deterministic/procedural, not an autonomous agent), and
        model_router.py's vendor model references (anthropic/openai/xai
        pinned in a routing table, but the tools/ai/clients/<family>.py it
        cites does not exist on disk -- unwired scaffolding, so correctly
        NOT recorded as vendor_in_use, which would have overclaimed a
        non-live dependence). AXIS-X-Y-Z reconfirmed byte-identical
        (diff -rq, zero output) -- not independently scanned. axis-seo (20
        files, full read) is AI-crawler-aware SEO tooling with none of the
        89 target capabilities -- absent. ROOT-CAUSED a recurring YAML-escape
        corruption bug that had resurfaced across CAND-SCAN-01 through -04:
        apply-scripts were passing previously-read backslash-bearing text as
        the REPLACEMENT argument to re.sub(), which silently re-interprets
        backslash sequences as backreference syntax and halves the escaping
        on every pass. Fixed by rephrasing the one affected matrix fragment
        without a literal backslash (eliminating the landmine rather than
        chasing it again) and documented the root cause + correct pattern
        (lambda replacement) in SONNET5_ECOSYSTEM_SCAN_STRATEGY.md. Overall
        floor rose 4.8% -> 5.7%, repos scanned 9 -> 12.
      files_changed: [AI_ECOSYSTEM_CAPABILITY_MATRIX.yaml, SCAN_TREE.yaml, continuation.yaml, derived/rollup.json, derived/capability_map.html, SONNET5_ECOSYSTEM_SCAN_STRATEGY.md, evidence/AXIS-ENGINE.scan.yaml, evidence/AXIS-X-Y-Z.scan.yaml, evidence/axis-seo.scan.yaml]
      commit: "(this commit)"
    - date: "2026-08-16"
      session_id: "CAND-SCAN-03 (Sonnet 5, continued same conversation as Session 0/CAND-SCAN-02)"
      summary: >-
        Scanned no-fate-payment-engine (4997 files, AI-heaviest repo) and
        paid-docs (16 files, docs-only). MCP_MCP_SDK strengthened with a
