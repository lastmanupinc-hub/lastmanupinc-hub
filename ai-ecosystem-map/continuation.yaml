###############################################################################
# continuation.yaml — live state ledger for the AI Ecosystem Capability Map
# Updated at the END of every session. automated_loop_state is the resume
# pointer every new session reads first (via begin.yaml).
###############################################################################
project_continuation:
  version: v1
  role: live_state_ledger_and_post_session_truth

  reference_policy:
    before_session_read: [begin.yaml, continuation.yaml, SCAN_TREE.yaml]
    after_session:
      - update_automated_loop_state   # set next_candidate_id before ending ANY session
      - append_change_log_entry
      - matrix_change_log_also_updated_if_rows_touched
    recursive_self_triggering_forbidden: true

  automated_loop_state:
    mode: continuous_candidate_completion
    policy_source: begin.yaml#autonomous_loop_bootstrap
    backlog_source: SCAN_TREE.yaml
    last_updated: "2026-08-16"
    last_completed_candidate_id: CAND-SCAN-02   # AXIS-Foundry, A-eye, axis-launch — first real evidence: MCP_MCP_SDK + MCP_MCP_REGISTRY graded peer (hand-rolled, tested, production-wired MCP server + registry manifest), MCP_FASTMCP + AGT_PYDANTIC_AI bench, AGE_LANGGRAPH partial (plan/execute/replan loop + real HITL review, no graph/checkpointing). Overall floor 4.4%, 7/31 repos. Also fixed a gov_lint.py G4 bug (paths must resolve via each evidence entry's own `repo` field, not flat against /home/user).
    next_candidate_id: CAND-SCAN-03             # no-fate-payment-engine, paid-docs — AI-heaviest repo (PAI'D platform + Trust Fabric AI certify-or-refuse engine)
    completed_candidate_ids: [CAND-SCAN-01, CAND-SCAN-02]

  scan_phase:
    active: true
    started: "2026-08-16"
    artifact_url: "https://claude.ai/code/artifact/ee96e72a-d6b9-4f36-a974-04ce825b9986"
    artifact_rule: >
      After each session's re-render, republish derived/capability_map.html to
      this same URL (pass it as `url` to the Artifact tool) so the picture
      stays at one stable link.
    strategy_doc: SONNET5_ECOSYSTEM_SCAN_STRATEGY.md
    backlog_source: SCAN_TREE.yaml
    exit_criteria_source: SCAN_TREE.yaml#exit_criteria
    note: >
      Repo-major loop: 11 scan batches + 1 consolidation. Every session
      executes exactly one candidate, commits once per the ritual, and
      advances next_candidate_id before ending.

  # Newest-first. {date, session_id, summary, files_changed, commit}
  change_log:
    - date: "2026-08-16"
      session_id: "CAND-SCAN-02 (Sonnet 5, continued same conversation as Session 0)"
      summary: >-
        Scanned AXIS-Foundry (1860 files), A-eye (3 files), axis-launch (3
        files). AXIS-Foundry surfaced the first real peer evidence: a
        hand-rolled JSON-RPC 2.0 MCP server (no SDK import, tested,
        production-wired via api_server.py + cli.py) graded peer for
        MCP_MCP_SDK; its registry-manifest builder (server.json + drift-guard
        test + /.well-known/mcp.json) graded peer for MCP_MCP_REGISTRY;
        dataclass-based tool registration graded bench for MCP_FASTMCP; the
        typed-action-schema AvatarAgent graded bench for AGT_PYDANTIC_AI;
        the plan/execute/replan loop + real human-in-the-loop review
        workflow graded partial for AGE_LANGGRAPH (missing: graph structure,
        cross-process checkpointing). A-eye (rendering-IP whitepaper) and
        axis-launch (submission intake) contributed no evidence. All other
        AXIS-Foundry categories verified absent on real code (not just
        grep noise) — xAI Grok / TRELLIS.2-Modal / RunPod recorded as
        vendor_in_use, never credited toward grade. GOTCHA: gov_lint.py G4
        was checking evidence file paths against /home/user/<path> instead
        of /home/user/<repo>/<path>, using each evidence entry's own `repo`
        field — fixed and reverified. Overall floor rose 0.0% -> 4.4%,
        7/31 repos scanned.
      files_changed: [AI_ECOSYSTEM_CAPABILITY_MATRIX.yaml, SCAN_TREE.yaml, continuation.yaml, derived/rollup.json, derived/capability_map.html, tools/gov_lint.py, evidence/AXIS-Foundry.scan.yaml, evidence/A-eye.scan.yaml, evidence/axis-launch.scan.yaml]
      commit: "(this commit)"
      session_id: "SESSION-0 (Fable 5, plan-approved bootstrap + CAND-SCAN-01 pilot)"
      summary: >-
        SCAFFOLD: built the full control plane (targets taxonomy 89 slots,
        matrix 89 rows, loop files, tools: rollup/gov_lint/renderer; v0
        all-unaudited map rendered, byte-determinism verified, gov_lint G1-G11
        PASS). PILOT: executed CAND-SCAN-01 (lastmanupinc-hub, .github,
        Remedial-Action, axis-launch-community — 4 files total across 4 repos,
        two empty). All 11 batteries + dependence battery: zero capability
        code hits; prose-only README mentions of other repos recorded as
        non-evidence. All 89 rows graded absent with search_expressions;
        overall floor 0.0% (expected and correct under peer-independence
        doctrine). GOTCHA: regex containing \. must be double-escaped when
        embedded in double-quoted YAML scalars (MCP battery, fixed via \\.).
        NOTE: dedicated-repo creation blocked (token 403); control plane
        hosted in profile repo ai-ecosystem-map/ — migration is a plain copy.
      files_changed: [AI_ECOSYSTEM_CAPABILITY_MATRIX.yaml, SCAN_TREE.yaml, continuation.yaml, derived/rollup.json, derived/capability_map.html, evidence/lastmanupinc-hub.scan.yaml, evidence/.github.scan.yaml, evidence/Remedial-Action.scan.yaml, evidence/axis-launch-community.scan.yaml]
