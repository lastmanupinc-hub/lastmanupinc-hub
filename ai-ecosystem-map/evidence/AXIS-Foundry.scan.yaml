purpose: >
  AI-native 3D asset foundry (avatar/prop/vehicle/etc. generation, rigging,
  validation, export). Python 3.11+ sovereign engine (stdlib-only runtime),
  1860 files. First batch to surface real peer-independence evidence.
files_read: 9
findings:
  mcp:
    - files: ["engine/axis_foundry/mcp_server.py:1601-1740 (McpServer class)", "engine/axis_foundry/mcp_server.py:154-217 (ToolDef/ToolParam)"]
      note: >
        Hand-rolled JSON-RPC 2.0 MCP protocol server: initialize/tools-list/
        tools-call/shutdown dispatch, protocol-version negotiation, stdio
        transport, notification handling (2026-07-21 spec-compliance fixes
        documented in comments with live-repro'd bug history). No `import
        mcp` SDK — genuinely built from the spec. Tested: tests/test_mcp_server.py,
        tests/test_mcp_post_process.py, tests/test_tools_mcp_submission.py.
      suggests_grade: peer
      slots: [MCP_MCP_SDK]
    - files: ["engine/axis_foundry/mcp_server.py:1463-1481 (build_registry_manifest)", "server.json", "tools/gen_mcp_server_json.py"]
      note: >
        In-house registry-manifest publication: build_registry_manifest() is
        the single source consumed by the checked-in server.json, the
        GET /.well-known/mcp.json route (api_server.py:6450), and a
        drift-guard test. Actually published to registry.modelcontextprotocol.io
        per MCP_REGISTRY_RUNBOOK.md.
      suggests_grade: peer
      slots: [MCP_MCP_REGISTRY]
    - files: ["engine/axis_foundry/mcp_server.py:154-217"]
      note: >
        ToolDef/ToolParam dataclasses give declarative tool registration with
        JSON-schema generation, annotations, examples, x402 pricing metadata —
        ergonomic but attribute/dataclass-based, not decorator-based like
        FastMCP; no generic auth/composition layer.
      suggests_grade: bench
      slots: [MCP_FASTMCP]
  ai_agent:
    - files: ["engine/axis_foundry/ai/ai_agent.py:1-810 (full read)"]
      note: >
        Real, model-agnostic agent framework: typed frozen-dataclass action
        input/output schemas (ParseGoalInput/Output, GenerateBodyInput/Output,
        etc.), ACTION_SCHEMAS registry, validate_action_input, pluggable
        decide/execute callables, AvatarAgent with plan_actions/execute_plan/
        replan_if_needed/run. Production-called from cli.py:4217 and
        api_server.py:9901. Tested: tests/test_ai_agent.py,
        tests/test_agent_destubbing.py (name implies a prior stub was wired
        for real).
      suggests_grade: bench
      slots: [AGT_PYDANTIC_AI]
  agentic_ai:
    - files: ["engine/axis_foundry/ai/ai_agent.py:748-782 (replan_if_needed, run)", "engine/axis_foundry/ai/human_in_loop.py:1-45"]
      note: >
        AvatarAgent.run() is a real plan->execute->evaluate->replan loop
        (stateful cycles) with iteration cap. human_in_loop.py's
        ReviewSession/create_review_session/submit_decision is a genuine
        human-in-the-loop review workflow, wired into api_server.py at 3
        call sites (lines 2688, 8943, 10156) — covers 2 of LangGraph's 4
        defining features (stateful cycles + HITL interrupts).
      suggests_grade: partial
      slots: [AGE_LANGGRAPH]
      missing_for_peer: >
        No node/edge graph structure (fixed linear action list, not a general
        graph engine) and no persistent/resumable checkpointing across
        process restarts — plan + review state are in-memory/per-request.
