###############################################################################
# ECOSYSTEM_TARGETS.yaml — canonical AI-ecosystem target taxonomy
#
# Source: "The Modern AI Ecosystem — Tools" infographic (LinkedIn, captured
# 2026-08-16): 11 categories, 89 vendor tool slots.
#
# This file is IMMUTABLE REFERENCE DATA for the scan loop. Scan sessions grade
# the portfolio against each slot's capability_definition (the FUNCTION the
# vendor provides), never against the brand name.
#
# SCORING DOCTRINE — PEER-INDEPENDENCE (owner directive 2026-08-16, verbatim):
#   "We are checking to see if what we built in house is aligned with these as
#    peers. Not our ability to use them, our ability to never need them. A
#    score of 0% peer is not only acceptable but it's expected. Initial
#    discovery is more important that we are honest than blindly optimistic.
#    So we can build on truth."
#
# Consequences:
#   - Using a vendor tool is evidence of DEPENDENCE, recorded in the matrix's
#     vendor_in_use field. It NEVER raises a grade.
#   - Honest absent is the expected default until file evidence proves more.
#   - not_peer_evidence lists per slot are binding guardrails for graders.
###############################################################################
meta:
  schema_version: 1
  created: "2026-08-16"
  source: "LinkedIn infographic 'The Modern AI Ecosystem — Tools' (11 categories, 89 tools)"
  category_count: 11
  slot_count: 89
  row_id_prefixes:
    llm: LLM
    agentic_ai: AGE
    rag: RAG
    embedding: EMB
    mcp: MCP
    ai_security: SEC
    observability: OBS
    memory: MEM
    ai_agent: AGT
    automation: AUT
    vector_database: VDB

categories:

  llm:
    label: "LLM"
    slots:
      openai_gpt:
        label: "OpenAI GPT"
        capability_definition: >
          Frontier general-purpose LLM served via API: instruction following,
          long-context reasoning, tool use, chat completion.
        peer_bar: "An in-house trained/hosted model + serving path making external frontier-LLM APIs unnecessary."
        not_peer_evidence: ["calling the OpenAI API", "prompt templates", "wrapper clients"]
      anthropic_claude:
        label: "Anthropic Claude"
        capability_definition: >
          Frontier LLM with strong long-context + agentic tool use, served via API.
        peer_bar: "Same bar as openai_gpt: own model, own serving."
        not_peer_evidence: ["calling the Anthropic API", "CLAUDE.md files", "agent prompts"]
      google_gemini:
        label: "Google Gemini"
        capability_definition: >
          Frontier multimodal LLM (text+image+audio in, long context) via API.
        peer_bar: "In-house multimodal model + serving."
        not_peer_evidence: ["calling the Gemini API"]
      meta_llama:
        label: "Meta Llama"
        capability_definition: >
          Open-weight LLM family you can download, fine-tune, and self-host.
        peer_bar: "Own trained open-weight-class model, or a full fine-tune + self-host pipeline of comparable capability built in-house."
        not_peer_evidence: ["merely downloading/running Llama weights (that is using the vendor's model)"]
      mistral_ai:
        label: "Mistral AI"
        capability_definition: >
          Efficient mid-size open/hosted LLMs (dense + MoE) with strong
          cost/perf, API + weights.
        peer_bar: "In-house efficient mid-size model line."
        not_peer_evidence: ["calling Mistral API", "running Mistral weights"]
      cohere:
        label: "Cohere"
        capability_definition: >
          Enterprise-focused LLM API line (command/generate + retrieval-tuned models).
        peer_bar: "In-house enterprise LLM serving with retrieval-tuned variants."
        not_peer_evidence: ["calling Cohere API"]
      hugging_face:
        label: "Hugging Face"
        capability_definition: >
          Model hub + inference/hosting ecosystem: distribution, versioning,
          discovery of models/datasets, hosted inference endpoints.
        peer_bar: "In-house model registry + artifact distribution + inference hosting for own models."
        not_peer_evidence: ["downloading models from HF", "transformers imports"]
      ollama:
        label: "Ollama"
        capability_definition: >
          Local LLM runtime: pull-and-run model management on developer
          machines, local API server, quantized execution.
        peer_bar: "In-house local model runtime/loader with model management and a local serving API."
        not_peer_evidence: ["docs telling users to install Ollama"]
      vllm:
        label: "vLLM"
        capability_definition: >
          High-throughput GPU inference server: paged attention/KV-cache
          management, batching, OpenAI-compatible serving of open models.
        peer_bar: "In-house high-throughput inference server with batching + KV management."
        not_peer_evidence: ["deploying vLLM", "renting endpoints that run vLLM"]

  agentic_ai:
    label: "Agentic AI"
    slots:
      langgraph:
        label: "LangGraph"
        capability_definition: >
          Graph-based agent orchestration: nodes/edges over LLM steps,
          stateful cycles, checkpointing, human-in-the-loop interrupts.
        peer_bar: "In-house stateful agent-graph orchestrator with resumable checkpoints."
        not_peer_evidence: ["import langgraph"]
      crewai:
        label: "CrewAI"
        capability_definition: >
          Role-based multi-agent teams: agents with roles/goals/tools
          collaborating on tasks with delegation.
        peer_bar: "In-house multi-agent role/delegation framework."
        not_peer_evidence: ["import crewai"]
      microsoft_autogen:
        label: "Microsoft AutoGen"
        capability_definition: >
          Conversational multi-agent framework: agents messaging each other,
          group chat patterns, code-execution agents.
        peer_bar: "In-house agent-to-agent conversation/coordination runtime."
        not_peer_evidence: ["import autogen"]
      ms_agent_framework:
        label: "Microsoft Agent Framework"
        capability_definition: >
          Unified enterprise agent framework (AutoGen+Semantic Kernel line):
          typed workflows, state, telemetry, deployment path.
        peer_bar: "In-house typed, observable, deployable agent workflow framework."
        not_peer_evidence: ["SDK usage"]
      llamaindex_workflows:
        label: "LlamaIndex Workflows"
        capability_definition: >
          Event-driven async workflow engine for LLM steps: steps subscribe to
          events, emit events, with retries and streaming.
        peer_bar: "In-house event-driven LLM workflow engine."
        not_peer_evidence: ["import llama_index"]
      aws_strands_agents:
        label: "AWS Strands Agents"
        capability_definition: >
          Model-driven agent SDK: minimal loop where the model plans tool use
          directly, with AWS-native deployment.
        peer_bar: "In-house model-driven tool-loop agent SDK."
        not_peer_evidence: ["SDK usage"]
      camel:
        label: "CAMEL"
        capability_definition: >
          Research framework for communicative multi-agent societies:
          role-playing agents, task decomposition via dialogue, data generation.
        peer_bar: "In-house multi-agent society/simulation framework."
        not_peer_evidence: ["import camel"]
      agno:
        label: "Agno"
        capability_definition: >
          Lightweight full-stack agent framework: agents + teams + workflows
          with built-in memory, knowledge, and a runtime UI.
        peer_bar: "In-house batteries-included agent runtime (memory+knowledge+UI)."
        not_peer_evidence: ["import agno"]

  rag:
