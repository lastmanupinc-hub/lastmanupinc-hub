purpose: >
  AXIS Engine — a real-time/offline 3D rendering + XR engine (91,207 files;
  by far the largest scanned repo). Matches the perceptual-rendering
  architecture (IRIS/RETINA/PUPIL) described in A-eye's whitepaper (CAND-SCAN-02)
  and the guild-hall XR feature specs. Contains a distinct, narrow AI-native
  content pipeline (tools/ai/, tools/oracles/) for book-to-game generation
  quality judging, separate from the rendering engine core.
files_read: 10
huge_repo_depth_note: >
  91,207 files. Battery hit counts even after excluding node_modules/dist/
  target/generated/archive were in the thousands per category (ai_security
  3589, rag 4926, agentic_ai 5614, memory 3405, llm 2828, automation 5632,
  observability 9972) -- dominated overwhelmingly by graphics-engine
  vocabulary collisions (rendering "pipeline", GPU "memory"/"queue", ray
  "trace", "orchestrat" for engine subsystems, "workflow" for visual
  scripting, network "retry"/"reliable" transport). Grep-only depth applied
  per the huge-repo rule: sampled the highest-signal hits per category
  (files with paths suggesting AI relevance: tools/ai/, tools/oracles/,
  AXR/*/ml_models.rs) rather than exhaustively reading thousands of
  rendering-engine files. Did not do a directory-by-directory sweep of all
  91k files -- revisit at CAND-CONSOLIDATE-12 if warranted.
findings:
  observability:
    - files: ["slate/tools/ai/model_router.py:1-295", "slate/tools/oracles/judge_quorum.py:1-70", "slate/tools/oracles/fidelity_floor.py:1-30", "slate/tools/run_all_gates.py:1-53"]
      note: >
        A real, CI-gated LLM-judge harness for the book-to-game content
        pipeline: model_router.py is a pure (no direct API calls) declarative
        routing table (determinism_mode x style_pack -> generator/judge
        models, family-disjoint judge rule). judge_quorum.py implements
        cross-family 2-judge quorum voting with tiebreak/escalation over
        7 subgates (text/visual/motion/audio/narrative/rig/cross_asset_
        coherence), each driven by a judge_prompts/*.txt file. fidelity_floor.py
        is an 8-oracle sequential enforcement chokepoint with PASS/RETRY/
        ESCALATE verdict aggregation and per-emit audit logging. All three
        are wired into run_all_gates.py as numbered CI gates (QGATE_3/6/7)
        with embedded self-tests ("ROUTER SELF-TEST: PASS" etc.) run "after
        every change" per the runner's own docstring.
      suggests_grade: bench
