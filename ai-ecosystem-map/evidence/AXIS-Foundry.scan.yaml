not_credited_adjacent_findings: >
  security_config.py (649 lines) and audit_trail.py (634 lines) are real,
  production-grade infra security / tamper-evident audit logging — but they
  govern deployment secrets, headers, and general app events, not AI/LLM
  content safety or AI-call tracing, so they do NOT match any SEC_* or OBS_*
  slot definition (those slots are specifically about guardrails on
  generative content, or tracing/eval of AI calls). refusal_policy.yaml
  gates 3D-mesh export quality (game_ready/dcc_editable/print_ready tiers),
  not LLM-output moderation — also not credited. ai_quality_eval.py scores
  generated 3D assets (QualityDimension/DimensionScore), which is
  eval-harness-*shaped* but scores mesh geometry, not LLM/agent call
  traces — left uncredited under the doctrine's "grade down when uncertain"
  rule; worth re-examining at CAND-CONSOLIDATE-12 if the OBS category stays
  thin. vector_database: 0 files matched any battery (3D pipeline has no
  RAG/semantic-search surface).
