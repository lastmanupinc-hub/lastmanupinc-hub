###############################################################################
# AI_ECOSYSTEM_CAPABILITY_MATRIX.yaml — THE LEDGER
#
# SINGLE SOURCE OF TRUTH for how the lastmanupinc-hub portfolio grades against
# the 89 AI-ecosystem targets in ECOSYSTEM_TARGETS.yaml. The other governance
# files (CLAUDE.md, begin.yaml, continuation.yaml, SCAN_TREE.yaml) read from
# this matrix and never claim a grade it contradicts.
#
# Schema modeled on slate v1 (AXIS-ENGINE/slate/CAPABILITY_GAP_MATRIX.yaml)
# + AXIS-Foundry in-matrix change_log. Scoring doctrine: PEER-INDEPENDENCE —
# see ECOSYSTEM_TARGETS.yaml meta block (owner directive 2026-08-16, verbatim).
#
# AUTHORING RULES (lint-enforced by tools/gov_lint.py):
#   - Never grade above absent without at least one real file path in
#     peer_evidence (paths are verified to exist on disk at lint time).
#   - Never grade absent without recorded search_expressions.
#   - vendor_in_use NEVER justifies a grade above absent (dependence != peer).
#   - grade == partial requires missing_for_peer.
#   - Grades are restated, never overwritten: every change lands in change_log
#     with rows_touched. Upgrades require new file evidence; downgrades are
#     allowed any time with a reason.
#   - parity_100_criteria numbers are written ONLY by tools/rollup.py --write.
###############################################################################
meta:
  schema_version: 1
  created: "2026-08-16"
  schema_source: "slate v1 (AXIS-ENGINE/slate/CAPABILITY_GAP_MATRIX.yaml) + AXIS-Foundry change_log pattern"
  targets_source: ECOSYSTEM_TARGETS.yaml
  grade_enum: [peer, peer_plus, bench, partial, scaffold, absent, unaudited]
  grade_meanings:
    peer: "In-house capability fully replaces the vendor tool; end-to-end equivalence demonstrated (code + tests/verifier/wired call site)."
    peer_plus: "Exceeds the vendor on at least one axis, with cited evidence."
    bench: "Working in-house implementation exists and runs, but not proven end-to-end equivalent."
    partial: "Real code covers part of the capability; missing_for_peer names the rest."
    scaffold: "Only hints/stubs/design docs found; no working implementation read."
    absent: "Searched and not found; search_expressions recorded."
    unaudited: "Not yet scanned. Counts as 0 in all rollups."
  grade_weights: {peer: 1.0, peer_plus: 1.0, bench: 0.75, partial: 0.4, scaffold: 0.15, absent: 0.0, unaudited: 0.0}
  row_count: 89
  last_updated: "2026-08-16"

