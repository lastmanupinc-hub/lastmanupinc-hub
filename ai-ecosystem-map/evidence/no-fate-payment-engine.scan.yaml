not_credited_adjacent_findings: >
  go-backend/internal/trustfabric/{certification,classification,scoring}/engine.go
  (the "certify-or-refuse" subsystem referenced in CLAUDE.md) are deterministic
  threshold/rule-based scoring and jurisdiction-control-set-lookup engines
  (DisciplineMinimums, HardFailThresholds, numeric score comparisons) — not
  LLM-driven judgment, so not credited toward any AI Security or RAG slot.
  go-backend/internal/trustfabric/taxonomy/ai.go IS a real Claude-driven deep
  audit engine (AnalyzeWithAI via Claude Opus, CommunicateWithUser via Claude
  Sonnet, Anthropic Messages API types with prompt caching) — this is genuine
  AI usage, but it is VENDOR DEPENDENCE (calls the Anthropic API), not an
  in-house peer LLM, so it is recorded under vendor_hits only, never credited
  toward LLM_ANTHROPIC_CLAUDE. Its own header comment claims "No OpenAI" but
  a stale docstring on AICommunication says "powered by OpenAI" — verified
  the actual code only defines Anthropic Messages API types; the OpenAI
  claim is not backed by code and is not recorded as vendor_in_use.
  go-backend/internal/domain/engines/radar_ml_pipeline.go is a real in-house
  ML model lifecycle registry (staging/canary/active, binary/regression/
  ensemble/rule-based classifiers) for fraud detection — genuine AI/ML work,
  but scores fraud risk, not text/language, so it doesn't match any LLM,
  embedding, or RAG slot definition; not credited.
  embed_handler.go serves an embeddable CHECKOUT WIDGET (iframe), a false
  positive on the word "embed" — unrelated to text embeddings; not credited.
