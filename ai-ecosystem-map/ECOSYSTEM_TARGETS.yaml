        peer_bar: "In-house prompt/program optimizer driven by eval metrics."
        not_peer_evidence: ["import dspy"]
      ragflow:
        label: "RAGFlow"
        capability_definition: >
          End-to-end RAG product: deep document understanding (layout/OCR),
