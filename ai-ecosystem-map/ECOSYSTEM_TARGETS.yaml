        peer_bar: "In-house document-understanding RAG service with citations."
        not_peer_evidence: ["deploying RAGFlow"]
      graphrag:
        label: "GraphRAG"
        capability_definition: >
          Knowledge-graph RAG: entity/relation extraction into a graph +
